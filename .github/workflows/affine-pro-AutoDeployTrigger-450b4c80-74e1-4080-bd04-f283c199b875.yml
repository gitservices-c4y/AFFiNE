name: Trigger auto deployment for affine-pro

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ canary ]
    paths:
    - '**'
    - '.github/workflows/affine-pro-AutoDeployTrigger-450b4c80-74e1-4080-bd04-f283c199b875.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AFFINEPRO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AFFINEPRO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AFFINEPRO_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.AFFINEPRO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AFFINEPRO_REGISTRY_PASSWORD }}
          containerAppName: affine-pro
          resourceGroup: IOP-Regional
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


